services:
  - type: web
    name: esbc-ai-api
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python -m app.ingest
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PYTHONUTF8
      - key: GOOGLE_API_KEY
        sync: false
